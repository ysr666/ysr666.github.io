<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081428">
<title>TunnelLab AI · 现场扫码体验</title>
<meta name="description" content="TunnelLab AI 量子隧穿学习馆现场体验入口">
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{min-height:100svh;display:grid;place-items:center;margin:0;color:#ecf8ff;background:radial-gradient(ellipse at 55% 14%,#124a68 0%,#0a1c36 45%,#061020 100%)}
main{width:min(90vw,520px);padding:34px 28px;border:1px solid #6dbfdf55;border-radius:22px;background:#0e2547bb;box-shadow:0 14px 60px #0005}
small{color:#6ee7ef;letter-spacing:.12em;font-size:12px;font-weight:700}h1{margin:10px 0 4px;font-size:clamp(28px,7vw,40px)}p{color:#cbdded;line-height:1.7}#status{font-size:17px;color:#e5f5fa}a,button{border:0;border-radius:12px;padding:13px 16px;display:inline-block;background:#8ceee8;color:#08314a;font-size:16px;font-weight:750;text-decoration:none;cursor:pointer}button{margin-right:8px}#manual{display:none}footer{margin-top:22px;font-size:12px;color:#90adca}
</style>
</head>
<body>
<main>
<small>AI × QUANTUM PHYSICS</small>
<h1>TunnelLab AI</h1>
<p>量子隧穿交互学习馆 · 现场扫码体验</p>
<p id="status" role="status" aria-live="polite">正在连接学习馆，即将自动进入…</p>
<button id="retry" type="button">重新检查</button>
<a id="manual" rel="noopener noreferrer">点此直接进入</a>
<footer>固定二维码入口 · 演示由现场 Mac 提供服务，未启动时暂时无法访问。</footer>
</main>
<script>
(function(){
 'use strict';
 const status=document.getElementById('status');
 const manual=document.getElementById('manual');
 const retry=document.getElementById('retry');
 let navigating=false, checking=false, lastApiCheck=0;
 const API='https://api.github.com/repos/ysr666/ysr666.github.io/contents/tunnellab/current.json?ref=main';
 function destination(s){
   if(!s || s.enabled!==true || typeof s.url!=='string') return null;
   try{
     const u=new URL(s.url);
     const age=Date.now()-Date.parse(s.updated_at);
     if(u.protocol!=='https:' || !/^[a-z0-9-]+\.trycloudflare\.com$/.test(u.hostname)) return null;
     if(!Number.isFinite(age) || age < -300000 || age > 12*3600*1000) return null;
     return u.href;
   }catch(e){return null;}
 }
 function navigate(url){
   if(navigating)return;
   navigating=true;
   status.textContent='已连接现场学习馆，正在自动进入…';
   manual.href=url;
   retry.style.display='none';
   window.location.replace(url);
   setTimeout(function(){
     manual.style.display='inline-block';
     if(document.visibilityState==='visible'){
       const meta=document.createElement('meta');
       meta.httpEquiv='refresh';
       meta.content='0;url='+url;
       document.head.appendChild(meta);
     }
   },1800);
 }
 async function pagesState(){
   const response=await fetch('./current.json?t='+Date.now(),{cache:'no-store'});
   if(!response.ok)throw new Error('Pages 尚未同步');
   return response.json();
 }
 async function githubState(){
   const controller=new AbortController();
   const timer=setTimeout(()=>controller.abort(),2600);
   try{
     const response=await fetch(API+'&t='+Date.now(),{
       cache:'no-store',signal:controller.signal,
       headers:{'Accept':'application/vnd.github+json'}
     });
     if(!response.ok)throw new Error('GitHub API 暂不可用');
     const payload=await response.json();
     if(typeof payload.content!=='string')throw new Error('状态文件格式错误');
     return JSON.parse(atob(payload.content.replace(/\s/g,'')));
   }finally{clearTimeout(timer);}
 }
 async function check(){
   if(checking||navigating)return;
   checking=true;
   status.textContent='正在连接学习馆，即将自动进入…';
   try{
     const useApi=Date.now()-lastApiCheck>45000;
     if(useApi)lastApiCheck=Date.now();
     const pages=pagesState().catch(()=>null);
     const api=useApi?githubState().catch(()=>null):Promise.resolve(null);
     let latest=null;
     const quick=await Promise.race([
       api.then(s=>({source:'api',state:s})),
       pages.then(s=>({source:'pages',state:s}))
     ]);
     const quickUrl=destination(quick.state);
     if(quickUrl && (quick.source==='api' || Date.now()-Date.parse(quick.state.updated_at)<25000)){
       navigate(quickUrl);return;
     }
     const [p,a]=await Promise.all([pages,api]);
     const states=[a,p].filter(Boolean).sort((x,y)=>Date.parse(y.updated_at||0)-Date.parse(x.updated_at||0));
     latest=states[0]||null;
     for(const s of states){const target=destination(s);if(target){navigate(target);return;}}
     status.textContent=latest&&latest.enabled?'公网入口正在同步，请稍候自动进入…':'现场演示尚未启动，启动后会自动进入。';
   }catch(e){status.textContent='正在重试公网入口，请稍后…';}
   finally{checking=false;}
 }
 retry.addEventListener('click',check);
 check();
 setInterval(check,3500);
})();
</script>
</body>
</html>

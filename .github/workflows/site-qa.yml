name: Site QA
on:
  push:
    branches: [main, 'site-quality-*']
  workflow_dispatch:
concurrency:
  group: site-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chinese screenshot fonts
        run: |
          if ! fc-list :lang=zh | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fi
          fc-list :lang=zh | head -n 3
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.51.0
          if command -v google-chrome >/dev/null; then
            echo "SITE_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            python -m playwright install chromium
          fi
      - name: Start HTTP server and test
        run: |
          python3 -m http.server 8080 > /tmp/site-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          python qa/test_site.py
      - name: Upload QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-qa-screenshots
          path: qa/current/
          if-no-files-found: ignore

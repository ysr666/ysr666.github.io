name: Site QA
on:
  push:
    branches: [main, 'site-quality-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Start HTTP server and test
        run: |
          python3 -m http.server 8080 > /tmp/site-http.log 2>&1 &
          python qa/test_site.py
      - name: Upload QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-qa-screenshots
          path: qa/current/
          if-no-files-found: ignore
